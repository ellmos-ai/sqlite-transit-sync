[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-transit-sync"
version = "0.4.0"
description = "Local-first SQLite synchronization through verified snapshots and configurable row-level merge policies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
authors = [{name = "Lukas Geiger / ellmos / BACH Contributors"}]
keywords = ["sqlite", "synchronization", "local-first", "offline-first", "snapshot", "database", "last-write-wins", "sync-master", "data-integrity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ellmos-ai/sqlite-transit-sync#readme"
Repository = "https://github.com/ellmos-ai/sqlite-transit-sync"
Issues = "https://github.com/ellmos-ai/sqlite-transit-sync/issues"
Documentation = "https://github.com/ellmos-ai/sqlite-transit-sync/blob/main/README.md"
Changelog = "https://github.com/ellmos-ai/sqlite-transit-sync/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/sqlite-transit-sync/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/ellmos-ai/sqlite-transit-sync/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/sqlite-transit-sync/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/sqlite-transit-sync/blob/main/llms.txt"

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=42", "tomli>=2; python_version < '3.11'", "ruff>=0.8"]
# The core stays dependency free on purpose: push/pull needs nothing but the standard
# library. Only publish-replica mode encrypts, so its cipher is opt-in.
crypto = ["cryptography>=42"]
# Loaded only when OSKeyringSecretResolver is explicitly used.
keyring = ["keyring>=25"]

[project.scripts]
sqlite-transit-sync = "sqlite_transit_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlite_transit_sync*"]

[tool.setuptools.package-data]
# The credential triggers ship with the package: without this the scan would
# raise on a pip-installed copy because the JSON never reaches the wheel.
sqlite_transit_sync = ["credential-triggers.json", "projection-contracts/*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
testpaths = ["tests"]
pythonpath = "."

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
