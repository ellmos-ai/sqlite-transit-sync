name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q -ra
          python -m pytest --collect-only -q

      - name: Run static and package checks
        run: |
          python -m compileall -q sqlite_transit_sync tests
          python -m ruff check sqlite_transit_sync tests

      - name: Run JSON CLI help smoke
        run: |
          python -m sqlite_transit_sync --help
          python -m sqlite_transit_sync init --help
